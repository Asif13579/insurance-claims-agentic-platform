services:

  api:
    build: .
    container_name: claims-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/insurance_claims
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: claims-postgres
    environment:
      POSTGRES_DB: insurance_claims
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d insurance_claims"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: